<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password — TeamOnlyGrowth</title>
<link rel="icon" href="/assets/teamonlygrowth-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="site-header"></div>
<main>
  <section class="section">
    <div class="container">
      <div class="section-head text-center" style="margin:0 auto 32px;">
        <span class="eyebrow">Reset password</span>
        <h1>Choose a new password</h1>
      </div>
      <div class="form-card">
        <div class="form-msg"></div>
        <form id="reset-form">
          <div class="field"><label for="r-password">New password</label><input id="r-password" type="password" name="password" minlength="8" required /></div>
          <button class="btn btn-primary btn-block" type="submit">Update password</button>
        </form>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script type="module" src="/js/partials.js"></script>
<script type="module" src="/js/analytics.js"></script>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
