<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forgot password — TeamOnlyGrowth</title>
<link rel="icon" href="/assets/teamonlygrowth-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="site-header"></div>
<main>
  <section class="section">
    <div class="container">
      <div class="section-head text-center" style="margin:0 auto 32px;">
        <span class="eyebrow">Reset password</span>
        <h1>Forgot your password?</h1>
        <p style="margin:0 auto;">Enter your email and we'll send a reset link.</p>
      </div>
      <div class="form-card">
        <div class="form-msg"></div>
        <form id="forgot-form">
          <div class="field"><label for="f-email">Email</label><input id="f-email" type="email" name="email" required /></div>
          <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
          <a class="btn btn-whatsapp btn-block" data-wa-fallback href="#" style="display:none; margin-top:10px;" target="_blank" rel="noopener">Talk on WhatsApp instead</a>
        </form>
        <p class="form-foot"><a href="/login.html">Back to login</a></p>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script type="module" src="/js/partials.js"></script>
<script type="module" src="/js/analytics.js"></script>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
