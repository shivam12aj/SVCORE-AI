<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign up — TeamOnlyGrowth</title>
<meta name="description" content="Create your TeamOnlyGrowth account to track enquiries, quotes, payments and project status." />
<link rel="icon" href="/assets/teamonlygrowth-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="site-header"></div>
<main>
  <section class="section">
    <div class="container">
      <div class="section-head text-center" style="margin:0 auto 32px;">
        <span class="eyebrow">Create account</span>
        <h1>Set up your TeamOnlyGrowth account</h1>
      </div>

      <div class="form-card">
        <div class="form-msg"></div>
        <form id="signup-form">
          <div class="grid-2">
            <div class="field"><label for="s-name">Full name</label><input id="s-name" name="full_name" required /></div>
            <div class="field"><label for="s-email">Email</label><input id="s-email" type="email" name="email" required /></div>
          </div>
          <div class="grid-2">
            <div class="field"><label for="s-whatsapp">WhatsApp number</label><input id="s-whatsapp" name="whatsapp" required /></div>
            <div class="field"><label for="s-city">City</label><input id="s-city" name="city" required /></div>
          </div>
          <div class="grid-2">
            <div class="field"><label for="s-business">Business / brand name</label><input id="s-business" name="business_name" /></div>
            <div class="field"><label for="s-type">Business type</label><input id="s-type" name="business_type" placeholder="e.g. Retail, Clinic, Coaching" /></div>
          </div>
          <div class="field">
            <label for="s-service">Interested service</label>
            <select id="s-service" name="interested_service">
              <option value="meta-ads">Meta Ads</option>
              <option value="google-ads">Google Ads</option>
              <option value="lead-generation">Lead Generation</option>
              <option value="social-media-marketing">Social Media Marketing</option>
              <option value="seo">SEO</option>
              <option value="website-development">Website Development</option>
              <option value="whatsapp-marketing">WhatsApp Marketing</option>
              <option value="content-creation">Content Creation</option>
              <option value="not-sure">Not sure yet</option>
            </select>
          </div>
          <div class="field"><label for="s-goal">Main goal</label><input id="s-goal" name="main_goal" placeholder="e.g. More leads, more sales, brand awareness" required /></div>
          <div class="grid-2">
            <div class="field"><label for="s-website">Website URL (optional)</label><input id="s-website" name="website_url" /></div>
            <div class="field"><label for="s-ig">Instagram URL (optional)</label><input id="s-ig" name="instagram_url" /></div>
          </div>
          <div class="field"><label for="s-budget">Marketing budget (optional)</label><input id="s-budget" name="marketing_budget" /></div>
          <div class="field"><label for="s-password">Password</label><input id="s-password" type="password" name="password" minlength="8" required /><span class="hint">At least 8 characters.</span></div>
          <button class="btn btn-primary btn-block" type="submit">Create account</button>
          <a class="btn btn-whatsapp btn-block" data-wa-fallback href="#" style="display:none; margin-top:10px;" target="_blank" rel="noopener">Talk on WhatsApp instead</a>
        </form>
        <p class="form-foot">Already have an account? <a href="/login.html">Log in</a></p>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script type="module" src="/js/partials.js"></script>
<script type="module" src="/js/analytics.js"></script>
<script type="module" src="/js/auth.js"></script>
<script type="module">
  // Pre-select the service if arriving from a service detail page (?service=id)
  const id = new URLSearchParams(location.search).get("service");
  if (id) {
    const select = document.querySelector("#s-service");
    if (select) select.value = id;
  }
</script>
</body>
</html>
