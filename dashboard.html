<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Dashboard — TeamOnlyGrowth</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/teamonlygrowth-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="site-header"></div>

<main class="dash-shell">
  <aside class="dash-side" id="dash-nav">
    <a href="/dashboard.html?section=overview" data-section="overview">Overview</a>
    <a href="/dashboard.html?section=profile" data-section="profile">My Profile</a>
    <a href="/dashboard.html?section=enquiries" data-section="enquiries">My Enquiries</a>
    <a href="/dashboard.html?section=quotes" data-section="quotes">My Quotes</a>
    <a href="/dashboard.html?section=payments" data-section="payments">My Payments</a>
    <a href="/dashboard.html?section=projects" data-section="projects">My Projects</a>
    <a href="/dashboard.html?section=updates" data-section="updates">Project Updates</a>
    <a href="/contact.html">Support</a>
    <a href="#" data-logout>Logout</a>
  </aside>
  <section class="dash-main">
    <p class="muted" style="margin-bottom:4px;">Logged in as <strong data-user-email>—</strong></p>
    <div data-dashboard="overview"></div>
  </section>
</main>

<div id="site-footer"></div>
<script>
  // Set which dashboard section to render BEFORE js/dashboard.js runs.
  const section = new URLSearchParams(location.search).get("section") || "overview";
  document.querySelector("[data-dashboard]").dataset.dashboard = section;
  document.querySelectorAll("#dash-nav a[data-section]").forEach((a) => {
    if (a.dataset.section === section) a.classList.add("active");
  });
</script>
<script type="module" src="/js/partials.js"></script>
<script type="module" src="/js/dashboard.js"></script>
</body>
</html>
